name: Actions Runner Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - name: Runner probe
        run: |
          echo "runner=ubuntu-latest"
          uname -a
          free -h || true
